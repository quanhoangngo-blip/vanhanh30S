<title>Tài liệu nội bộ Vận hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">


<style>
:root{--paper:#F6F8F7;--surface:#FFFFFF;--ink:#15242B;--ink-2:#48605F;--ink-3:#7C9091;--line:#D9E2DE;--accent:#0E6E5C;--accent-soft:#DCEDE7;--cut:#973030;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1719;--surface:#152125;--ink:#E8F0ED;--ink-2:#AFC3BF;--ink-3:#7B918E;--line:#26373B;--accent:#4FC0A4;--accent-soft:#16332D;--cut:#E58C86;}}
:root[data-theme="dark"]{--paper:#0E1719;--surface:#152125;--ink:#E8F0ED;--ink-2:#AFC3BF;--ink-3:#7B918E;--line:#26373B;--accent:#4FC0A4;--accent-soft:#16332D;--cut:#E58C86;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
#gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:404px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px;box-shadow:0 1px 2px rgba(21,36,43,.06),0 10px 34px rgba(21,36,43,.07)}
.lockmark{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:18px}
.lockmark svg{width:19px;height:19px;display:block}
.card h1{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0 0 6px;line-height:1.3}
.card p.sub{font-size:14px;color:var(--ink-2);margin:0 0 22px;line-height:1.55}
label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{width:100%;margin-top:12px;font:inherit;font-size:15px;font-weight:600;padding:11px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:hover:not(:disabled){filter:brightness(1.08)}
.msg{min-height:20px;margin-top:11px;font-size:13.5px;color:var(--cut)}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="gate">
  <form class="card" id="f">
    <div class="lockmark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.5" fill="none"></rect>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" fill="none"></path>
      </svg>
    </div>
    <h1>Tài liệu nội bộ Khối Vận hành</h1>
    <p class="sub">Nội dung được mã hoá. Nhập mật khẩu để xem.</p>
    <label for="pw">Mật khẩu</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Mở tài liệu</button>
    <p class="msg" id="m" role="status" aria-live="polite"></p>
    <p class="foot">Mã hoá AES-256-GCM, khoá dẫn xuất bằng PBKDF2-SHA256 250.000 vòng. Nội dung chỉ được giải mã trên máy bạn — mật khẩu không được gửi đi đâu.</p>
  </form>
</div>
