<style id="gate-style">
:root{--paper:#F5F7F6;--surface:#FFF;--ink:#15242B;--ink-2:#46605E;--line:#DCE4E1;--accent:#0E6E5C;--cut:#B03A2E}

#gate button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#gate .m{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--cut)}
</style></head><body>
