<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hiệu quả 56 salon – nền KH 2027</title>

<style>
:root{
  color-scheme: light;
  --bg:#f6f6f4; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e1dc; --grid:#ebeae6;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#7a7974;
  --s1:#2a78d6; --s2:#eb6834; --pos:#2a78d6; --neg:#e34948; --mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --g1:#0ca30c; --g2:#7cc47c; --g3:#3987e5; --g4:#fab219; --g5:#ec835a; --g6:#d03b3b;
  --accent:#1c5cab;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#33332f; --grid:#2a2a27;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --s1:#3987e5; --s2:#d95926; --pos:#3987e5; --neg:#e66767; --mid:#383835; --accent:#86b6ef;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#33332f; --grid:#2a2a27;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
  --s1:#3987e5; --s2:#d95926; --pos:#3987e5; --neg:#e66767; --mid:#383835; --accent:#86b6ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
header{margin-bottom:22px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--ink-2);font-size:13.5px}
.note{color:var(--ink-3);font-size:12.5px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .lab{font-size:12.5px;color:var(--ink-2)}
.tile .val{font-size:26px;font-weight:650;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.tile .ctx{font-size:12.5px;color:var(--ink-3)}
.down{color:var(--crit)} .up{color:var(--good)}
ol.kl{margin:0;padding-left:20px} ol.kl li{margin:6px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;border-bottom:1px solid var(--line);padding:8px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--grid);padding:8px;vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:hover td{background:var(--surface-2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dec td:first-child{font-weight:650;white-space:nowrap}
@media (max-width:700px){.dec thead{display:none}.dec tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.dec td{display:block;border:0;padding:2px 0;text-align:left!important;white-space:normal!important}.dec td[data-l]:before{content:attr(data-l) ": ";color:var(--ink-3);font-size:12px}}
#sTbl td:first-child{white-space:nowrap;font-weight:600} #sTbl td:last-child{min-width:220px}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.gcard{border:1px solid var(--line);border-radius:10px;padding:12px;border-top:4px solid var(--c)}
.gcard .big{font-size:24px;font-weight:650}
.gcard .nm{font-size:13px;font-weight:600;min-height:36px}
.gcard .kv{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
svg text{fill:var(--ink-2);font-size:12px;font-family:inherit}
svg .lbl{fill:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);cursor:default}
.chip.prob{border-color:var(--ink-3)}
.grow{margin:12px 0}
.grow .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13.5px;font-weight:600}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.fbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=search]{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;min-width:160px}
label.ck{font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
th.sort{cursor:pointer} th.sort:after{content:" ↕";color:var(--ink-3);font-weight:400}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:320px;opacity:0;transition:opacity .08s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.stack{display:flex;height:10px;border-radius:4px;overflow:hidden;min-width:90px;gap:2px;background:var(--surface)}
.warnbox{border-left:3px solid var(--warn);background:var(--surface-2);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--ink-2)}
footer{color:var(--ink-3);font-size:12.5px;margin-top:20px}
</style>
</head>
<body>

<style>
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:22px}
.gate p{margin:0;color:var(--ink-2);font-size:14px}
.gate input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gate button{font:inherit;font-weight:600;font-size:15px;color:var(--surface);background:var(--ink);border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:wait}
.gate .eyebrow{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.gate .err{color:var(--neg);font-size:13.5px;min-height:1.2em}
</style>
<div class="gate" id="gate"><form id="gate-form" autocomplete="off">
  <div class="eyebrow">Tài liệu nội bộ · Bộ phận Vận hành</div>
  <h1>Nhập mật khẩu để xem báo cáo</h1>
  <p>Nội dung đã được mã hóa. Liên hệ người gửi nếu chưa có mật khẩu.</p>
  <label for="gate-pw" class="eyebrow" style="margin-top:4px">Mật khẩu</label>
  <input type="password" id="gate-pw" required autofocus>
  <button type="submit" id="gate-btn">Mở báo cáo</button>
  <div class="err" id="gate-err" role="alert"></div>
</form></div>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openReport(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:ub(ENC.s), iterations:ENC.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(ENC.i)}, key, ub(ENC.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
document.getElementById("gate-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("gate-btn"), err = document.getElementById("gate-err");
  btn.disabled = true; btn.textContent = "Đang mở…"; err.textContent = "";
  try {
    const pw = document.getElementById("gate-pw").value;
    const p = await openReport(pw);
    try { sessionStorage.setItem("rp-pw", pw); } catch(e) {}
    document.getElementById("gate").remove();
    const holder = document.createElement("div"); holder.innerHTML = p.html; document.body.append(...holder.childNodes);
    const s = document.createElement("script"); s.textContent = p.js; document.body.appendChild(s);
  } catch(e) {
    err.textContent = "Mật khẩu không đúng. Kiểm tra lại chữ hoa/thường và dấu gạch ngang.";
    btn.disabled = false; btn.textContent = "Mở báo cáo";
  }
});
// Tải lại trang trong cùng tab thì không phải nhập lại
try { const saved = sessionStorage.getItem("rp-pw"); if (saved) { document.getElementById("gate-pw").value = saved; document.getElementById("gate-form").requestSubmit(); } } catch(e) {}
