<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Khách &amp; AOV quanh lễ 2/9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#16212D; --ink2:#48566A; --muted:#788597; --line:#DCE2EA; --line2:#EDF0F4;
  --y26:#2F62B0; --y25:#C07A1E; --neg:#B42318; --negbg:#FBE9E7; --pos:#1E7A46; --posbg:#E6F4EC; --band:#EBEFF5; --storm:#8A96A6;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#141A22; --ink:#E5EBF2; --ink2:#AEB9C6; --muted:#7D899A; --line:#27313D; --line2:#1D2530;
  --y26:#5A8AD6; --y25:#C4832B; --neg:#F07A6E; --negbg:#3A1D1B; --pos:#62C28D; --posbg:#15301F; --band:#1A222D; --storm:#6D7888;}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#141A22; --ink:#E5EBF2; --ink2:#AEB9C6; --muted:#7D899A; --line:#27313D; --line2:#1D2530;
  --y26:#5A8AD6; --y25:#C4832B; --neg:#F07A6E; --negbg:#3A1D1B; --pos:#62C28D; --posbg:#15301F; --band:#1A222D; --storm:#6D7888;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;padding-inline:20px;padding-block:32px 64px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:12px;max-width:760px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;margin:0;font-weight:600;text-wrap:balance}
.lead{font-size:17px;color:var(--ink2);margin:0;max-width:68ch}
.lead b{color:var(--ink)}
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sub{color:var(--muted);font-size:13.5px;margin:0;max-width:80ch}
.findings{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.findings li{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 20px;border-top:1px solid var(--line2)}
.findings li:first-child{border-top:0}
.findings .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.findings p{margin:0;max-width:78ch}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.93em}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.bridge{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bridge .st{flex:1 1 180px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line2)}
.bridge .st:first-child{border-left:0}
.bridge .v{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.bridge .l{font-size:13px;color:var(--ink2)}
.bridge .op{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;background:transparent;color:var(--ink2);border:0;padding:7px 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--ink2);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--y26);outline-offset:2px}
.legend{display:flex;gap:18px;font-size:13px;color:var(--ink2);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:2px;border-radius:2px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:170px}
.tip .h{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line2)}
th{font-weight:600;color:var(--ink2);font-size:12px;vertical-align:bottom;border-top:0;background:var(--surface);position:sticky;top:0}
th.grp{text-align:center;color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line2)}
td:first-child,th:first-child{text-align:left}
td.txt{text-align:left;white-space:normal;min-width:160px;color:var(--ink2);font-size:12.5px}
td .num{font-size:13px}
tr.total td{font-weight:600;background:var(--line2)}
.pill{display:inline-block;font-family:var(--mono);font-size:12.5px;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.bad{background:var(--negbg);color:var(--neg)} .pill.good{background:var(--posbg);color:var(--pos)} .pill.flat{color:var(--ink2)}
.sep{border-left:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr;gap:14px}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px 28px;font-size:13.5px;color:var(--ink2)}
.method div{display:flex;flex-direction:column;gap:2px}
.method b{color:var(--ink);font-weight:600;font-size:13px}
.method p{margin:0}
@media (max-width:640px){.findings li{grid-template-columns:1fr;gap:4px}.legend{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<style>
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:22px}
.gate p{margin:0;color:var(--ink2);font-size:14px}
.gate input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gate button{font:inherit;font-weight:600;font-size:15px;color:var(--surface);background:var(--ink);border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:wait}
.gate .err{color:var(--neg);font-size:13.5px;min-height:1.2em}
</style>
<div class="gate" id="gate"><form id="gate-form" autocomplete="off">
  <div class="eyebrow">Tài liệu nội bộ · Bộ phận Vận hành</div>
  <h1>Nhập mật khẩu để xem báo cáo</h1>
  <p>Nội dung đã được mã hóa. Liên hệ người gửi nếu chưa có mật khẩu.</p>
  <label for="gate-pw" class="eyebrow" style="margin-top:4px">Mật khẩu</label>
  <input type="password" id="gate-pw" required autofocus>
  <button type="submit" id="gate-btn">Mở báo cáo</button>
  <div class="err" id="gate-err" role="alert"></div>
</form></div>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openReport(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:ub(ENC.s), iterations:ENC.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(ENC.i)}, key, ub(ENC.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
document.getElementById("gate-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("gate-btn"), err = document.getElementById("gate-err");
  btn.disabled = true; btn.textContent = "Đang mở…"; err.textContent = "";
  try {
    const pw = document.getElementById("gate-pw").value;
    const p = await openReport(pw);
    try { sessionStorage.setItem("rp-pw", pw); } catch(e) {}
    document.getElementById("gate").remove();
    const holder = document.createElement("div"); holder.innerHTML = p.html; document.body.append(...holder.childNodes);
    const s = document.createElement("script"); s.textContent = p.js; document.body.appendChild(s);
  } catch(e) {
    err.textContent = "Mật khẩu không đúng. Kiểm tra lại chữ hoa/thường và dấu gạch ngang.";
    btn.disabled = false; btn.textContent = "Mở báo cáo";
  }
});
// Tải lại trang trong cùng tab thì không phải nhập lại
try { const saved = sessionStorage.getItem("rp-pw"); if (saved) { document.getElementById("gate-pw").value = saved; document.getElementById("gate-form").requestSubmit(); } } catch(e) {}
